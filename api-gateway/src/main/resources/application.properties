spring.application.name=api-gateway

# Porta de entrada: o Postman chama http://localhost:8080/...
server.port=8080

# ===== Eureka =====
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== Rotas =====
# Tudo que chegar em /automacoes/** vai para o servico "log-service" registrado no Eureka.
# "lb://" = load balancer: o Gateway pergunta ao Eureka o endereco do servico.
spring.cloud.gateway.server.webflux.routes[0].id=log-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://log-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/automacoes/**

# Para adicionar outro microsservico, copie o bloco acima trocando o [0] por [1], o nome e o Path.

# Mostra no console por onde cada requisicao foi roteada (bom para estudar)
logging.level.org.springframework.cloud.gateway=DEBUG
